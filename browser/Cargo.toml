[package]
name = "memora-browser"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[[bin]]
name = "memora-browser"

[[bin]]
name = "memora_browser_helper"

[features]
default = []

sandbox = [
    "cef/sandbox",
]

[package.metadata.cef.bundle]
helper_name = "memora_browser_helper"
resources_path = "resources"

[dependencies]
cef = {
    version = "154.5.0",
    default-features = false,
    features = ["build-util"]
}
blake3 = "1"
lz4_flex = "0.11"
zstd = "0.13"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = {
    version = "0.61",
    features = [
        "Win32_Foundation",
        "Win32_UI_WindowsAndMessaging",
    ]
}

[target.'cfg(target_os = "windows")'.build-dependencies]
winres = "0.1"

[workspace]